[package]
name = "ransomshield"
version = "0.1.0"
edition = "2021"

[dependencies]
nix = { version = "0.31", features = ["fanotify", "signal", "process", "fs"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
sd-notify = "0.5"
sha2 = "0.10"

[profile.release]
lto = true
strip = true
